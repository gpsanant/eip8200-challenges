name: EIP-8200 SHA-256 Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: eip8200-sha256-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    uses: ./.github/workflows/_benchmark-track.yml
    with:
      track: sha256
