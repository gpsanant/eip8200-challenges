name: EIP-8200 benchmark track

on:
  workflow_call:
    inputs:
      track:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Validate track
        shell: bash
        run: |
          case "${{ inputs.track }}" in
            sha256|modexp|ripemd160) ;;
            *) echo "invalid benchmark track" >&2; exit 64 ;;
          esac

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.24.6
          cache: false

      - name: Fingerprint trusted benchmark source
        id: trusted-source
        shell: bash
        run: |
          set -euo pipefail
          trusted_hash="$({
            git ls-files -s -- . \
              ':!Challenge/Sha256/Submission/**' \
              ':!Challenge/Modexp/Submission/**' \
              ':!Challenge/Ripemd160/Submission/**'
          } | git hash-object --stdin)"
          echo "hash=${trusted_hash}" >> "${GITHUB_OUTPUT}"

      - name: Restore pinned Lean packages
        id: package-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages
          key: eip8200-benchmark-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Restore trusted project build
        id: project-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: eip8200-benchmark-project-${{ inputs.track }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.trusted-source.outputs.hash }}

      - name: Restore benchmark tools
        id: benchmark-tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .benchmark-tools
          key: eip8200-benchmark-tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('setup.sh') }}

      - name: Setup benchmark
        run: ./setup.sh "${{ inputs.track }}"
        env:
          BENCHMARK_LAKE_CACHE_RESTORED: ${{ steps.package-cache.outputs.cache-hit == 'true' && '1' || '0' }}
          BENCHMARK_TOOLS_CACHE_RESTORED: ${{ steps.benchmark-tools-cache.outputs.cache-hit }}

      # Persist only state produced before editable Lean modules are compiled.
      - name: Save pinned Lean packages
        if: steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages
          key: ${{ steps.package-cache.outputs.cache-primary-key }}

      - name: Save trusted project build
        if: steps.project-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: ${{ steps.project-cache.outputs.cache-primary-key }}

      - name: Save benchmark tools
        if: steps.benchmark-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .benchmark-tools
          key: ${{ steps.benchmark-tools-cache.outputs.cache-primary-key }}

      - name: Benchmark submission
        run: ./benchmark.sh "${{ inputs.track }}"

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          summary="benchmark-results/${{ inputs.track }}/summary.md"
          if [[ -f "${summary}" ]]; then
            cat "${summary}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "## Benchmark failed — see the job log" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload score
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: benchmark-score-${{ inputs.track }}
          path: benchmark-results/${{ inputs.track }}/score.json
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: benchmark-diagnostics-${{ inputs.track }}-${{ github.run_id }}
          path: benchmark-results/${{ inputs.track }}/
          if-no-files-found: warn
