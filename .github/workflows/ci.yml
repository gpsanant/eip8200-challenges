name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build and check the direct-EVM proof layer once. Every challenge imports
  # this layer, so challenge jobs restore this exact cache instead of racing to
  # compile and save three copies of it.
  shared-lean:
    name: Shared Lean proof infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      package-key: ${{ steps.cache-keys.outputs.package-key }}
      shared-key: ${{ steps.cache-keys.outputs.shared-key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute shared cache keys
        id: cache-keys
        env:
          DEPENDENCY_HASH: ${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          SHARED_HASH: ${{ hashFiles('lakefile.toml', 'Challenge/EvmProof.lean', 'Challenge/EvmProof/**/*.lean', 'Checks/EvmProof.lean') }}
        run: |
          package_key="lake-packages-v3-${{ runner.os }}-${{ runner.arch }}-${DEPENDENCY_HASH}"
          shared_key="project-shared-v2-${{ runner.os }}-${{ runner.arch }}-${DEPENDENCY_HASH}-${SHARED_HASH}"
          echo "package-key=$package_key" >> "$GITHUB_OUTPUT"
          echo "shared-key=$shared_key" >> "$GITHUB_OUTPUT"

      # Preserve complete package workspaces, including Git metadata. Caching
      # only package build directories makes Lake discard restored artifacts as
      # invalid checkouts.
      - name: Cache pinned packages
        id: package-cache
        uses: actions/cache@v5
        with:
          path: .lake/packages
          key: ${{ steps.cache-keys.outputs.package-key }}
          restore-keys: |
            lake-packages-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Cache shared project build
        uses: actions/cache@v5
        with:
          # Native module traces include native dependency artifacts. Preserve
          # package IR alongside root build output so restoring one without
          # the other cannot invalidate otherwise unchanged proofs.
          path: |
            .lake/build
            .lake/packages/*/.lake/build/ir
          key: ${{ steps.cache-keys.outputs.shared-key }}
          restore-keys: |
            project-shared-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            project-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          # `cache-hit` is empty only for a total miss; it is `false` for a
          # restore-prefix hit whose complete workspace already has Mathlib.
          use-mathlib-cache: ${{ steps.package-cache.outputs.cache-hit == '' }}
          build: "false"
          test: "false"
          lint: "false"
          use-github-cache: "false"

      - name: Build shared EVM proof support
        run: lake build +Challenge.EvmProof:c.o

      - name: Verify shared soundness
        run: |
          if grep -rn --include='*.lean' -w 'sorry' Challenge/EvmProof Challenge/EvmProof.lean; then
            echo "::error::found an unfinished proof in shared EVM support"
            exit 1
          fi
          lake build +Checks.EvmProof

  # Each matrix entry has its own job and source-keyed project cache. A RIPEMD
  # submission therefore neither rebuilds nor invalidates SHA-256 or MODEXP.
  challenge:
    name: ${{ matrix.name }} proofs, submissions, and gas
    needs: shared-lean
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SHA-256
            directory: Sha256
            slug: sha256
            executable: sha256challenge
            main: Sha256Main.lean
            target: +Challenge.Sha256 sha256challenge
          - name: RIPEMD-160
            directory: Ripemd160
            slug: ripemd160
            executable: ripemd160challenge
            main: Ripemd160Main.lean
            target: +Challenge.Ripemd160 ripemd160challenge
          - name: MODEXP
            directory: Modexp
            slug: modexp
            executable: modexpchallenge
            main: ModexpMain.lean
            target: +Challenge.Modexp modexpchallenge
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore pinned packages
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: ${{ needs.shared-lean.outputs.package-key }}
          fail-on-cache-miss: true

      - name: Restore shared project build
        uses: actions/cache/restore@v5
        with:
          path: |
            .lake/build
            .lake/packages/*/.lake/build/ir
          key: ${{ needs.shared-lean.outputs.shared-key }}
          fail-on-cache-miss: true

      - name: Cache ${{ matrix.name }} project build
        uses: actions/cache@v5
        with:
          # These outputs form one Lake trace graph and must be restored as a
          # unit; caching only the root outputs forces native dependencies cold.
          path: |
            .lake/build
            .lake/packages/*/.lake/build/ir
          key: project-${{ matrix.slug }}-v2-${{ runner.os }}-${{ runner.arch }}-${{ needs.shared-lean.outputs.shared-key }}-${{ hashFiles(format('Challenge/{0}.lean', matrix.directory), format('Challenge/{0}/**', matrix.directory), matrix.main, format('Checks/{0}.lean', matrix.directory)) }}
          # The final prefix can bootstrap the split from a base-branch cache
          # during migration; challenge-local caches always take precedence.
          restore-keys: |
            project-${{ matrix.slug }}-v2-${{ runner.os }}-${{ runner.arch }}-${{ needs.shared-lean.outputs.shared-key }}-
            project-${{ matrix.slug }}-v1-${{ runner.os }}-${{ runner.arch }}-
            project-lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-github-cache: "false"

      - name: Build ${{ matrix.name }} proofs and scorer
        run: lake build ${{ matrix.target }}

      # A proof is only a proof if its axiom footprint is the standard one.
      # The textual scan catches an unfinished proof that an umbrella misses.
      - name: Verify ${{ matrix.name }} soundness
        run: |
          if grep -rn --include='*.lean' -w 'sorry' \
              "Challenge/${{ matrix.directory }}" \
              "Challenge/${{ matrix.directory }}.lean" \
              "${{ matrix.main }}"; then
            echo "::error::found an unfinished ${{ matrix.name }} proof"
            exit 1
          fi
          lake build "+Checks.${{ matrix.directory }}"

      # Keep each statement auditable in isolation. Proof support and bundled
      # implementations may depend on the spec, never the reverse.
      - name: Verify ${{ matrix.name }} specification boundary
        run: |
          imports="$(grep '^import ' "Challenge/${{ matrix.directory }}/Spec.lean")"
          if [ "$imports" != 'import EvmSemantics.EVM.BigStep' ]; then
            echo "::error::${{ matrix.name }} Spec.lean must depend only on the pinned EVM semantics"
            printf '%s\n' "$imports"
            exit 1
          fi

      # The Yul compiler is only the reproducible generator for the frozen
      # artifact; direct-bytecode proofs target the literal bytes themselves.
      - name: Verify frozen ${{ matrix.name }} reference bytecode
        run: |
          reference="Challenge/${{ matrix.directory }}/Reference"
          compiled="$(lake exe yulc "$reference/reference.yul")"
          frozen="$(tr -d '[:space:]' < "$reference/reference.hex")"
          literal="$(lake exe ${{ matrix.executable }} --print-reference-hex)"
          if [ "$compiled" != "$frozen" ] || [ "$literal" != "$frozen" ]; then
            echo "::error::${{ matrix.name }} reference.hex is stale"
            exit 1
          fi

      # Candidate PRs follow a fixed module/declaration convention. These
      # checks validate theorem type, bytecode identity, transitive axioms,
      # executable vectors, and optional proved gas schedules.
      - name: Verify ${{ matrix.name }} submissions and gas report
        run: |
          scripts/check-${{ matrix.slug }}-submissions.sh --self-test
          scripts/check-${{ matrix.slug }}-submissions.sh
          scripts/report-${{ matrix.slug }}-gas.sh --self-test
          scripts/check-${{ matrix.slug }}-gas-report.sh

      - name: Run ${{ matrix.name }} scorer controls
        run: |
          case "${{ matrix.slug }}" in
            sha256)
              printf '60206000f3' > /tmp/sha256-zeros.hex
              if lake exe sha256challenge --hex=/tmp/sha256-zeros.hex; then
                echo "::error::the SHA-256 scorer accepted a candidate returning 32 zero bytes"
                exit 1
              fi
              ;;
            ripemd160)
              lake exe ripemd160challenge --hex=Challenge/Ripemd160/Reference/reference.hex
              printf '60206000f3' > /tmp/ripemd160-zeros.hex
              if lake exe ripemd160challenge --hex=/tmp/ripemd160-zeros.hex; then
                echo "::error::the RIPEMD-160 scorer accepted a candidate returning 32 zero bytes"
                exit 1
              fi
              ;;
            modexp)
              lake exe modexpchallenge
              ;;
          esac

  # Independent gas re-measurement under revm. This deliberately shares no
  # Lean code with the proof jobs, so disagreement between the EVMs is visible.
  crosscheck:
    name: Cross-check published gas under revm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: foundry
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # lib/forge-std and the pinned eth-act/evmification implementations.
          # Not recursive: evmification's own libraries are not imported here.
          submodules: true

      # Pinned rather than floating: exact gas equality is reproducible only
      # against a fixed revm, so a toolchain bump remains a deliberate change.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Check formatting
        run: forge fmt --check

      - name: Cross-check reference gas against the published numbers
        run: forge test -vv
